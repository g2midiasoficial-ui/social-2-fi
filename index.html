<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix: Social Media Planner & Analytics</title>
    <meta name="description" content="A complete social media management platform featuring an interactive visual planner calendar, 150-video modular factory (10x5x3), AI viral video multiplier, video transcriber & viral script remixer, multi-network post creator with realistic phone previews for Instagram and TikTok, AI caption assistant, and growth analytics dashboards." />
    <meta property="og:title" content="Remix: Social Media Planner & Analytics" />
    <meta property="og:description" content="A complete social media management platform featuring an interactive visual planner calendar, 150-video modular factory (10x5x3), AI viral video multiplier, video transcriber & viral script remixer, multi-network post creator with realistic phone previews for Instagram and TikTok, AI caption assistant, and growth analytics dashboards." />
    <script>
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(value) {
              currentFetch = value;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Failed to define fetch getter/setter on window:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
